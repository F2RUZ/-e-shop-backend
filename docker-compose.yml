services:
  # ── PostgreSQL bazasi ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: eshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - eshop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Baza tashqariga ochilmaydi — faqat api konteyneri ko'radi

  # ── NestJS backend ───────────────────────────────────────────
  api:
    build: .
    container_name: eshop-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Konteyner ichida baza manzili — "localhost" emas, "db"
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
    volumes:
      # Yuklangan salon videolari konteynerda EMAS, serverning o'zida turadi.
      # Busiz `docker compose up --build` da barcha videolar yo'qolib ketardi,
      # chunki image qaytadan yig'ilganda konteyner ichidagi fayllar ketadi.
      - ./uploads:/app/uploads
    ports:
      # Faqat serverning o'zidan ko'rinadi — tashqariga nginx chiqaradi.
      # Lokalda sinash uchun http://localhost:${HOST_PORT}
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  # ── Admin panel (React + MUI, nginx tarqatadi) ───────────────
  admin:
    build:
      context: ./admin
      args:
        # ⚠️ Vite build paytida ichkariga yoziladi — o'zgarsa qayta build kerak
        VITE_API_URL: ${ADMIN_API_URL:-https://backend.magnateshop.uz/api}
    container_name: eshop-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADMIN_HOST_PORT:-4300}:80'

volumes:
  eshop-db-data:
